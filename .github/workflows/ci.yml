name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: backend (${{ matrix.os }})
    needs: [frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - run: uv sync --locked --dev
      - run: uv run --locked python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - run: uv sync --locked --dev
      - name: Check versions and release tag
        run: uv run --locked python tools/check-release.py versions
      - run: uv build --out-dir dist
      - name: Inspect distributions and extract source
        run: uv run --locked python tools/check-release.py distributions dist --extract-to tmp/sdist-source
      - name: Rebuild wheel from source distribution
        run: uv build --wheel tmp/sdist-source --out-dir tmp/sdist-wheel
      - name: Install rebuilt wheel into a separate environment
        run: |
          uv venv tmp/package-env --python 3.12
          uv pip install --python tmp/package-env/bin/python tmp/sdist-wheel/*.whl
      - name: Smoke test installed application and frontend
        run: >-
          tmp/package-env/bin/python -I -c "import group_watch.app;
          from group_watch.resources import frontend_dist;
          root=frontend_dist();
          assert root.name=='_static', root;
          assert (root/'index.html').is_file();
          assert (root/'THIRD_PARTY_NOTICES.md').is_file();
          print('Installed application and bundled UI: OK')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          --draft --verify-tag --generate-notes --title "Group Watch $RELEASE_TAG"
