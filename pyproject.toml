[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "group-watch"
version = "0.2.5"
description = "QQ group monitoring and evidence workbench with SnowLuma"
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1,<0.137",
    "uvicorn[standard]>=0.46.0,<0.47",
    "httpx>=0.28.1,<0.29",
    "websockets>=16.0,<17",
    "pydantic>=2.12.5,<3",
    "python-dotenv>=1.2.2,<2",
    "zstandard>=0.25.0,<0.26",
    "tzdata>=2025.1; sys_platform == 'win32'",
    "loguru>=0.7.3,<0.8",
    "psutil>=7.2.2,<8",
    "Pillow>=11.3,<13",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.3.0,<2"]

[project.scripts]
lan = "group_watch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["group_watch*"]

[tool.setuptools.package-dir]
"" = "src"
tools = "tools"

[tool.setuptools.cmdclass]
build_py = "tools.build_support.BuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]
